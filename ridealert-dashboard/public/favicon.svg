<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="symShieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <linearGradient id="symAlertGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF385C" />
      <stop offset="50%" stop-color="#E0115F" />
      <stop offset="100%" stop-color="#991B1B" />
    </linearGradient>
    <linearGradient id="symRoadGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.1" />
    </linearGradient>
    <filter id="symGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Shield Crest -->
  <path d="M 256 70 
           C 342 70, 402 116, 410 208
           C 418 300, 352 388, 256 448
           C 160 388, 94 300, 102 208
           C 110 116, 170 70, 256 70 Z" 
        fill="none" 
        stroke="url(#symShieldGrad)" 
        stroke-width="18" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#symGlow)" />

  <!-- Road Horizon Perspective -->
  <path d="M 188 416 L 236 304" stroke="url(#symRoadGrad)" stroke-width="10" stroke-linecap="round" />
  <path d="M 324 416 L 276 304" stroke="url(#symRoadGrad)" stroke-width="10" stroke-linecap="round" />
  <line x1="256" y1="408" x2="256" y2="364" stroke="#38BDF8" stroke-width="7" stroke-linecap="round" />
  <line x1="256" y1="344" x2="256" y2="316" stroke="#38BDF8" stroke-width="6" stroke-linecap="round" stroke-opacity="0.7" />

  <!-- The Vigilant Eye Aperture -->
  <path d="M 160 236 C 200 160, 312 160, 352 236" 
        fill="none" 
        stroke="#0F172A" 
        stroke-width="14" 
        stroke-linecap="round" 
        class="eye-brow" />
  <path d="M 160 236 C 200 160, 312 160, 352 236" 
        fill="none" 
        stroke="#FFFFFF" 
        stroke-width="10" 
        stroke-linecap="round" />

  <path d="M 172 242 C 206 298, 306 298, 340 242" 
        fill="none" 
        stroke="#38BDF8" 
        stroke-width="8" 
        stroke-linecap="round" />

  <!-- Eye Pupil / Alert Beacon -->
  <circle cx="256" cy="228" r="36" fill="url(#symAlertGrad)" />
  <circle cx="256" cy="228" r="16" fill="#FFFFFF" />
  <circle cx="263" cy="221" r="6" fill="#FFFFFF" opacity="0.9" />

  <!-- Radar Arc Wave -->
  <path d="M 210 140 C 236 126, 276 126, 302 140" 
        fill="none" 
        stroke="#00F2FE" 
        stroke-width="6" 
        stroke-linecap="round" />
</svg>
