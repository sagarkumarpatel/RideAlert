<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#161F33" />
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#818CF8" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#E0115F" stop-opacity="0.5" />
    </linearGradient>

    <!-- Shield Primary Gradient (Cyan to Vibrant Blue) -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>

    <!-- Alert Eye Accent Gradient (Alert Red/Magenta) -->
    <linearGradient id="alertGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF385C" />
      <stop offset="50%" stop-color="#E0115F" />
      <stop offset="100%" stop-color="#991B1B" />
    </linearGradient>

    <!-- Road Highway Gradient -->
    <linearGradient id="roadGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.05" />
    </linearGradient>

    <!-- Radial Ambient Backdrop Glow -->
    <radialGradient id="ambientGlow" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#E0115F" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#0B0F19" stop-opacity="0" />
    </radialGradient>

    <!-- Drop Shadow Filter -->
    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle App Icon Base -->
  <rect x="16" y="16" width="480" height="480" rx="112" ry="112" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="3" />
  
  <!-- Subtle Ambient Glow -->
  <circle cx="256" cy="240" r="180" fill="url(#ambientGlow)" />

  <!-- Inner Protective Shield Geometry -->
  <!-- Outer Shield Crest -->
  <path d="M 256 84 
           C 334 84, 388 126, 396 210
           C 404 294, 344 374, 256 428
           C 168 374, 108 294, 116 210
           C 124 126, 178 84, 256 84 Z" 
        fill="none" 
        stroke="url(#shieldGrad)" 
        stroke-width="16" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#glowFilter)" />

  <!-- Road Horizon Perspective (Converging Highway lines forming 'Ride') -->
  <path d="M 194 400 L 238 296" stroke="url(#roadGrad)" stroke-width="8" stroke-linecap="round" />
  <path d="M 318 400 L 274 296" stroke="url(#roadGrad)" stroke-width="8" stroke-linecap="round" />
  <!-- Dashed Center Highway Divider -->
  <line x1="256" y1="392" x2="256" y2="352" stroke="#38BDF8" stroke-width="6" stroke-linecap="round" stroke-opacity="0.9" />
  <line x1="256" y1="334" x2="256" y2="308" stroke="#38BDF8" stroke-width="5" stroke-linecap="round" stroke-opacity="0.6" />

  <!-- The Vigilant Eye Aperture (Computer Vision / ML Kit) -->
  <!-- Upper Eyelid Arch -->
  <path d="M 168 238 C 204 168, 308 168, 344 238" 
        fill="none" 
        stroke="#FFFFFF" 
        stroke-width="12" 
        stroke-linecap="round" />

  <!-- Lower Eyelid Arch -->
  <path d="M 176 244 C 208 296, 304 296, 336 244" 
        fill="none" 
        stroke="#FFFFFF" 
        stroke-width="8" 
        stroke-linecap="round" 
        stroke-opacity="0.8" />

  <!-- Eye Pupil / Radar Pulse Core (Alert Beacon) -->
  <circle cx="256" cy="232" r="34" fill="url(#alertGrad)" />
  <!-- Glowing Center Focus -->
  <circle cx="256" cy="232" r="16" fill="#FFFFFF" />
  <circle cx="262" cy="226" r="6" fill="#FFFFFF" opacity="0.9" />

  <!-- Subtle Top Radar Arc Pulse -->
  <path d="M 214 150 C 238 138, 274 138, 298 150" 
        fill="none" 
        stroke="#38BDF8" 
        stroke-width="6" 
        stroke-linecap="round" 
        stroke-dasharray="4 8" />
</svg>
